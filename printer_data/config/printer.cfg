[include mainsail.cfg]
[include NozzleClean.cfg]
[include goose_belt.cfg]
# host MCU service is preinstalled and ready to use with:
[mcu]
serial: /tmp/klipper_host_mcu
[include jw_led_effects_3_leds.cfg]
[include JW_NH36_config.cfg]
[include AFC/*.cfg]
# This file contains common pin mappings for the BIGTREETECH Octopus Max EZ.
# To use this config, the firmware should be compiled for the
# STM32H723 with a "128KiB bootloader", "25 MHz crystal",
# and one of:
# Communication interface: "USB (on PA11/PA12)",
# Communication interface: "CAN bus (on PD0/PD1)", or
# Communication interface: "USB to CAN bus bridge (USB on PA11/PA12))" and CAN bus interface: "CAN bus (on PD0/PD1)".
[virtual_sdcard]
path: /home/biqu/printer_data/gcodes

[display_status]

[pause_resume]


[exclude_object]

# See docs/Config_Reference.md for a description of parameters.
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_090019000C51313236343430-if00

[mcu cartographer] # See https://www.klipper3d.org/Config_Reference.html#mcu
# Remove either the serial or canbus_uuid line dependant on your setup.
serial: /dev/serial/by-id/usb-Cartographer_614e_340007000643564738333920-if00
restart_method: command # Not needed for probes using CAN. 

#[idle_timeout]
#gcode:
    #_DEMON_IDLE_TIMEOUT
#timeout: 3600
[temperature_sensor pad_7]
sensor_type: temperature_host

[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor TMC_X]
sensor_type: Generic 3950
sensor_pin: PC5
min_temp: 0
max_temp: 100

[temperature_sensor TMC_Y]
sensor_type: Generic 3950
sensor_pin: PC4
min_temp: 0
max_temp: 100

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PA7
min_temp: 0
max_temp: 100
gcode_id: C

[printer]
kinematics: corexy              # machine type
max_velocity: 600
max_accel: 9000
max_z_velocity: 15
max_z_accel: 600
#max_accel_to_decel: 9000       # S-Curve only - Normally 1/2 of max_accel
square_corner_velocity: 5.0

##################################################

[force_move]
enable_force_move: True

########################################


#####################################################################
#   X/Y Stepper Settings
#####################################################################

# Motor-1
[stepper_x]
step_pin: PC13
dir_pin: !PC14
enable_pin: !PE6
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: nhk:gpio10
position_endstop: 355
position_max: 355
position_min: 0
homing_speed: 30
homing_positive_dir: True

[tmc2209 stepper_x]
uart_pin: PG14
##diag_pin: PF0
run_current: 1.0
interpolate: false
sense_resistor: 0.110
#driver_sgt: 1    
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 2
driver_HSTRT: 5
stealthchop_threshold: 0

# Motor-2
[stepper_y]
step_pin: PE4
dir_pin: !PE5
enable_pin: !PE3
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PF2
position_endstop: 355
position_min: 0
position_max: 355
homing_speed: 30
homing_positive_dir: True



[tmc2209 stepper_y]
uart_pin: PG13
##diag_pin: PF2
run_current: 1.0
interpolate: false
sense_resistor: 0.110
#driver_sgt: 1    
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 2
driver_HSTRT: 5
stealthchop_threshold: 0

#####################################################################
#   Z Stepper Settings
#####################################################################



# Z0 Stepper - Front Left on MOTOR3A
[stepper_z]
step_pin: PE1
dir_pin: !PE0
enable_pin: !PE2
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16
endstop_pin: probe:z_virtual_endstop # use cartographer as virtual endstop
#position_endstop: 0.5
homing_retract_dist: 0 # cartographer needs this to be set to 0
position_min: -5.0
position_max: 240
  



[tmc2209 stepper_z]
uart_pin: PG12
interpolate: false
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0


# MZ1 Stepper - Rear Left on Motor4
[stepper_z1]
step_pin: PB8
dir_pin: PB9
enable_pin: !PB7
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32



[tmc2209 stepper_z1]
uart_pin: PG11
interpolate: false
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0


# Z2 Stepper - Rear Right on Motor5
[stepper_z2]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB6
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32





[tmc2209 stepper_z2]
uart_pin: PG10
interpolate: false
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0


##	Z3 Stepper - Front Right on Motor6
[stepper_z3]
step_pin: PG15
dir_pin: PB3
enable_pin: !PD5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32


[tmc2209 stepper_z3]
uart_pin: PG9
interpolate: false
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0


[extruder]
step_pin: nhk:gpio23
dir_pin: !nhk:gpio24
enable_pin: !nhk:gpio25
microsteps: 16
rotation_distance: 35.2												#Be sure to calibrate
gear_ratio: 44:8, 25:17
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nhk:gpio9
sensor_type: ATC Semitec 104GT-2          #Generic 3950
sensor_pin: nhk:gpio29
pullup_resistor: 2200
control = pid
pid_kp = 24.777
pid_ki = 1.966
pid_kd = 78.054
min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 1000                                     
max_extrude_cross_section: 37                                   
pressure_advance: 0.052                                             #Be sure to calibrate
pressure_advance_smooth_time: 0.040

#[filament_switch_sensor material_0]
#switch_pin: PF1

