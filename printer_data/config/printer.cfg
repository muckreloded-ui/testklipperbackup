[gcode_macro PRINT_START]
gcode:
  {% set BED_TEMP = params.BED|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER|default(195)|float %}
  {% set S_EXTRUDER_TEMP = 150|float %}
  {% set initial_tool = params.TOOL|default("0")|int %}

  G90 ; use absolute coordinates
  M83 ; extruder relative mode
  
  STATUS_HOMING
  G28 # Home Printer
  G90                                                   # Absolute position
  
  SET_DISPLAY_TEXT MSG="Leveling"                      # Display info on display
  STATUS_LEVELING                                      # Set LEDs to leveling-mode
  QUAD_GANTRY_LEVEL                                    # Level the printer via QGL
  G28 Z                                                # Home Z again after QGL

  AFC_PARK

  M140 S{BED_TEMP} # Set bed temp
  #EXTRUDER_PROGRESS
  M109 S{EXTRUDER_TEMP} # wait for extruder temp
  #T{initial_tool}  #PURGE_LENGTH=100 #Load Initial Tool
  #Load Initial Tool
  #BELT_POOP PURGE_LENGTH=100
  M104 S{S_EXTRUDER_TEMP} # set standby extruder temp
  M190 S{BED_TEMP} # wait for bed temp

  G28 Z 
   
          
  ##  Uncomment for bed mesh (2 of 2 for bed mesh)
  SET_DISPLAY_TEXT MSG="Bed mesh"                      # Display info on display
  STATUS_MESHING                                       # Set LEDs to bed mesh-mode
  
  BED_MESH_CALIBRATE ADAPTIVE=1                ; Calibrate the bed mesh
  #CARTOGRAPHER_TOUCH                ; Perform touch probe

  
  
  AFC_PARK
  M109 S{EXTRUDER_TEMP} ; wait for extruder temp
  G0 Z0.7  

  
  
   
  
  # Get ready to print by doing a primeline and updating the LEDs
  SET_DISPLAY_TEXT MSG="Printer goes brr"               # Display info on display
  STATUS_PRINTING 
  PRINT_PROGRESS
  #G0 X130 Y4 F10000                           # Go to starting point
  G0 Z0.7                                              # Raise Z to 0.4
  GOOSE_PURGE
  CLEAN_NOZZLE
  #G91                                                   # Incremental positioning 
  #G1 X100 E20 F1000                                     # Primeline
  G90                                                   # Absolute position
# ################################################# ####################
#  ENDPRINT
# ################################################# ####################

   
[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    CLEAR_PAUSE
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                 ; retract filament

    BT_TOOL_UNLOAD
    M104 S0                                                 ; turn only the hotend off
    M140 S0                                                 ; turn off the bed
    M107                                                    ; turn off part cooling fan

    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan

    SET_DISPLAY_TEXT MSG="Print complete!"          # Displays info

    BED_MESH_CLEAR

    SET_NOZZLE_LEDS_OFF                                 ; turn off nozzle LEDs

    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    
    


    


#######################################################################################################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set X = params.X|default(340)|int %}
    {% set Y = params.Y|default(25)|int %}
    {% set Z = params.Z|default(10)|int %}
    {% set E = params.E|default(1)|int %}
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-{E} F2100
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F6000

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    ##### set defaults #####
    {% set e = params.E|default(1) %} #edit to your retract length
    #### get VELOCITY parameter if specified ####
    {% if 'VELOCITY' in params|upper %}
      {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
    {%else %}
      {% set get_params = "" %}
    {% endif %}
    ##### end of definitions #####
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E{e} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}  
    RESUME_BASE {get_params}

